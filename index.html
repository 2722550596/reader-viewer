<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Reader</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: system-ui, "Noto Sans CJK SC", sans-serif; }
  #status { display: flex; height: 100%; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; line-height: 1.6; }
  #status.error { color: #f08a8a; }
  iframe { display: none; border: 0; width: 100%; height: 100%; }
  body.ready #status { display: none; }
  body.ready iframe { display: block; }
</style>
</head>
<body>
<div id="status">加载中…</div>
<iframe id="reader" sandbox="allow-scripts" title="Reader"></iframe>
<script>
(function () {
  var status = document.getElementById('status');
  var frame = document.getElementById('reader');

  function fail(message) {
    status.textContent = message;
    status.className = 'error';
  }

  function fetchGistFile(id) {
    return fetch('https://api.github.com/gists/' + encodeURIComponent(id), {
      headers: { Accept: 'application/vnd.github+json' }
    }).then(function (res) {
      if (res.status === 404) throw new Error('找不到这个 gist，可能已删除或链接有误。');
      if (res.status === 403 || res.status === 429) throw new Error('GitHub API 速率受限，请稍后再试。');
      if (!res.ok) throw new Error('读取 gist 失败（HTTP ' + res.status + '）。');
      return res.json();
    }).then(function (gist) {
      var names = Object.keys(gist.files || {});
      var name = names.find(function (n) { return /\.html?$/i.test(n); }) || names[0];
      if (!name) throw new Error('这个 gist 里没有文件。');
      var file = gist.files[name];
      if (!file.truncated) return file.content;
      return fetch(file.raw_url).then(function (res) {
        if (!res.ok) throw new Error('下载文件失败（HTTP ' + res.status + '）。');
        return res.text();
      });
    });
  }

  var id = decodeURIComponent(location.hash.replace(/^#/, '')).trim();
  if (!/^[a-f0-9]{20,64}$/i.test(id)) {
    fail('链接缺少 gist ID。正确格式：…/#<gistId>');
    return;
  }

  fetchGistFile(id).then(function (html) {
    frame.srcdoc = html;
    document.body.classList.add('ready');
  }).catch(function (err) {
    fail(err && err.message ? err.message : String(err));
  });
})();
</script>
</body>
</html>
